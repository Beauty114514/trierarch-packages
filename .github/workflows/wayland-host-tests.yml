name: wayland host tests

on:
  push:
    paths:
      - "wayland-host/**"
      - ".github/workflows/wayland-host-tests.yml"
  pull_request:
    paths:
      - "wayland-host/**"
      - ".github/workflows/wayland-host-tests.yml"

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wayland test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev wayland-protocols libwayland-bin
      - name: Run wayland-host host tests
        run: bash wayland-host/tests/host/run.sh
      - name: Run wayland-host host tests with ASAN/UBSAN
        run: bash wayland-host/tests/host/run_sanitizers.sh
